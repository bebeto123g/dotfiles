[bar.default]
center = [ "workspaces" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "keyboard_layout",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "wallpaper",
    "control-center",
    "session"
]
margin_ends = 0
padding = 8
radius = 8
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "clock", "sysmon" ]
thickness = 42
widget_spacing = 18

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.panel]
launcher_position = "auto"
open_near_click_control_center = true
open_near_click_launcher = true
open_near_click_session = true
open_near_click_wallpaper = true

[shell.session]
show_shortcuts = false

[theme]
builtin = "Ayu"

    [theme.templates]
    builtin_ids = [ "alacritty" ]

[wallpaper]
directory = "/home/bebeto/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/bebeto/Pictures/Wallpapers/molniia_groza_pasmurno_126444_2560x1440.jpg"

    [wallpaper.last]
    path = "/home/bebeto/Pictures/Wallpapers/molniia_groza_pasmurno_126444_2560x1440.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/bebeto/Pictures/Wallpapers/molniia_groza_pasmurno_126444_2560x1440.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/bebeto/Pictures/Wallpapers/molniia_groza_pasmurno_126444_2560x1440.jpg"

[widget.clock]
format = "{:%d.%m.%Y   %H:%M}"

[widget.launcher]
glyph = "grid-dots"
icon_color = "primary"

[widget.network]
show_label = false
